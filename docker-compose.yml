services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barsik}
      POSTGRES_DB: ${POSTGRES_DB:-barsik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barsik}
      TZ: Europe/Moscow
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # наружу не светить, только для локальных скриптов
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barsik} -d ${POSTGRES_DB:-barsik}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./docs:/app/docs:ro
      - ./data:/app/data
      - ./uploaded_docs:/app/uploaded_docs
      # Живое автообновление KB: правки документов и новый dist видны в контейнере
      - ./bars-kb/docs/source:/app/bars-kb/docs/source:ro
      - ./bars-kb/dist:/app/bars-kb/dist
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - redis
    restart: unless-stopped

volumes:
  qdrant_data:
  pg_data:
