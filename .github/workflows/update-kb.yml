name: Update KB package

on:
  push:
    branches: [main, master, feature/bars-kb, tg-bot, devops]
    paths:
      - "bars-kb/docs/source/**"
      # Editing this workflow also runs it: install, secret check and the
      # "documents unchanged" path can be verified without touching the docs.
      - ".github/workflows/update-kb.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-kb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: bars-kb

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: bars-kb/pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Require Qwen key
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
        run: |
          if [ -z "$QWEN_API_KEY" ]; then
            echo "::error::QWEN_API_KEY secret is required to publish a real KB build"
            exit 1
          fi

      - name: Rebuild and publish dist
        env:
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_BASE_URL: https://openrouter.ai/api/v1
          QWEN_LLM_MODEL: qwen/qwen3.8-flash
          QWEN_VISION_MODEL: qwen/qwen3.8-flash
          QWEN_EMBEDDING_MODEL: qwen/qwen3-embedding-8b
          LLM_PROVIDER: qwen
          VISION_PROVIDER: qwen
          EMBEDDING_PROVIDER: qwen
          EMBEDDING_DIM: "1024"
          ENRICHMENT_WORKERS: "4"
          QDRANT_PATH: data/qdrant-ci
          GIT_AUTHOR_NAME: bars-kb-bot
          GIT_AUTHOR_EMAIL: bars-kb-bot@users.noreply.github.com
          GIT_COMMITTER_NAME: bars-kb-bot
          GIT_COMMITTER_EMAIL: bars-kb-bot@users.noreply.github.com
        run: bars-kb sync --source docs/source --publish --keep 2 --eval
