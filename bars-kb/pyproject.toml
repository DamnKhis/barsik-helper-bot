[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bars-kb"
version = "0.1.0"
description = "Ingestion pipeline for BARS documentation knowledge base in Qdrant"
requires-python = ">=3.11"
dependencies = [
  "qdrant-client>=1.20.0",
  "python-docx>=1.2.0",
]

[project.scripts]
bars-kb = "bars_kb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
